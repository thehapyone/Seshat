# Seshat configuration. Copy to seshat.toml and edit before starting the stack.
#
#   cp seshat.example.toml seshat.toml
#
# The Compose stack mounts seshat.toml read-only at /etc/seshat/seshat.toml.
# Every setting Seshat has lives here except the five secrets, which come from
# the environment; see .env.example. Commented-out settings show the default.
# An unrecognised key is a startup error, not a silent no-op.

[database]
# schema = "seshat"

[embedding]
# Required. Any endpoint implementing POST {base_url}/embeddings.
base_url = "https://api.openai.com/v1"
model = "text-embedding-3-small"
dimension = 1536
# batch_size = 64

[chunking]
# Tokens. overlap must be smaller than size.
# size = 800
# overlap = 120

[retrieval]
# mode = "hybrid"          # "hybrid" or "vector"
# default_top_k = 8
# max_top_k = 50

[scan]
# default_limit = 25
# max_limit = 100
# max_payload_bytes = 256000

[limits]
# max_document_bytes = 8000000
# max_canonical_block_bytes = 64000
# max_upload_bytes = 52428800      # 50 MiB is also the ceiling
# max_filename_characters = 255

[storage]
# Absolute path, on the durable mount the Compose stack provides.
# source_dir = "/var/lib/seshat/sources"

[converter]
# "docling" converts PDF and Office uploads on CPU, which is slow
# and resource-heavy for large or scanned documents. "azure" sends them to Azure
# AI Document Intelligence instead, which also needs AZURE_OCR_API_KEY.
backend = "docling"

[converter.docling]
# The default Compose deployment starts Docling here. Leave empty to run without
# a converter: text and Markdown still work, other formats fail per job.
base_url = "http://docling:5001"
# Conversion is submitted as an asynchronous task and polled, so the deadline
# bounds the whole conversion while timeout_seconds bounds each HTTP request.
# Raise the deadline for very large or scanned PDFs.
# timeout_seconds = 120
# conversion_deadline_seconds = 3600
# poll_interval_seconds = 5

[converter.azure]
# Required when backend = "azure", together with AZURE_OCR_API_KEY.
# endpoint = "https://<resource>.cognitiveservices.azure.com"
# model_id = "prebuilt-layout"
# timeout_seconds = 300

[logging]
# level = "INFO"           # DEBUG, INFO, WARNING, ERROR or CRITICAL
