[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "Document ingestion and hybrid retrieval engine backed by PostgreSQL/pgvector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  # Multipart parsing for POST /v1/documents/file; httpx reaches docling-serve
  # or Azure Document Intelligence.
  "python-multipart>=0.0.18",
  "httpx>=0.27",
  "llama-index-core>=0.14",
  "llama-index-embeddings-openai>=0.6",
  "llama-index-vector-stores-postgres>=0.8",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
