name: seshat

services:
  seshat:
    build:
      context: .
    image: seshat:local
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      docling:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SESHAT_DATABASE_URL: postgresql://seshat:${SESHAT_POSTGRES_PASSWORD:?Set SESHAT_POSTGRES_PASSWORD in .env}@database:5432/seshat
      SESHAT_API_TOKEN: ${SESHAT_API_TOKEN:?Set SESHAT_API_TOKEN in .env}
      SESHAT_CURSOR_SIGNING_KEY: ${SESHAT_CURSOR_SIGNING_KEY:?Set SESHAT_CURSOR_SIGNING_KEY in .env}
      SESHAT_EMBEDDING_API_KEY: ${SESHAT_EMBEDDING_API_KEY:?Set SESHAT_EMBEDDING_API_KEY in .env}
      AZURE_OCR_API_KEY: ${AZURE_OCR_API_KEY:-}
    volumes:
      - ./seshat.toml:/etc/seshat/seshat.toml:ro
      - seshat-source-data:/var/lib/seshat/sources
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  database:
    image: pgvector/pgvector:pg17
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: seshat
      POSTGRES_USER: seshat
      POSTGRES_PASSWORD: ${SESHAT_POSTGRES_PASSWORD:?Set SESHAT_POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - seshat-db-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seshat -d seshat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.30.0
    init: true
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_RESULT_REMOVAL_DELAY: "3600"
    tmpfs:
      - /tmp:rw,exec,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:5001/health'', timeout=4).status == 200 else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  seshat-db-data:
  seshat-source-data:
